{{- if .Values.route.enabled }}
# Gateway API route: /api/reviews/... from the browser -> /reviews/... on review-service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.route.pathPrefix }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ .Values.route.rewritePrefix }}
      backendRefs:
        - name: {{ .Values.name }}
          port: {{ .Values.port }}
{{- end }}
